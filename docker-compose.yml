services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "1", "20", "-b", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/mock_api.py"]
    ports:
      - "8000:8000"
    environment:
      MOCK_API_HOST: "0.0.0.0"
      MOCK_API_PORT: "8000"
      MOCK_HISTORICAL_RECORDS: "10000"
      MOCK_STREAMING_RECORDS: "100000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  train:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/train.py", "--api-type", "historical"]
    environment:
      CLASSIFICATION_MODE: "binary"
      SOURCE_API_URL: "http://mock-api:8000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MODEL_PATH: "/app/models/pipeline"
    volumes:
      - models:/app/models
    depends_on:
      mock-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/fetcher.py"]
    environment:
      SOURCE_API_URL: "http://mock-api:8000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      INPUT_TOPIC: "network-conn"
      FETCH_TYPE: "streaming"
      FETCH_BATCH_SIZE: "1000"
      FETCH_INTERVAL: "1.0"
      FETCH_LOOP: "true"
    depends_on:
      mock-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "python"
      - "/app/src/stream_inference.py"
      - "--model"
      - "/app/models/pipeline"
      - "--input-topic"
      - "network-conn"
      - "--output-topic"
      - "predictions"
      - "--benign-topic"
      - "benign"
      - "--attack-topic"
      - "attack"
      - "--bootstrap"
      - "kafka:29092"
      - "--checkpoint"
      - "/app/checkpoint"
    environment:
      CLASSIFICATION_MODE: "binary"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MODEL_PATH: "/app/models/pipeline"
      CHECKPOINT_LOCATION: "/app/checkpoint"
    volumes:
      - models:/app/models:ro
      - checkpoint:/app/checkpoint
    depends_on:
      train:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/publisher.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SINK_API_URL: "http://mock-api:8000"
      PUBLISH_TOPIC: "predictions"
      PUBLISH_BATCH_SIZE: "1000"
      PUBLISH_TIMEOUT: "5.0"
    depends_on:
      stream-processor:
        condition: service_started
      kafka:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  checkpoint:
