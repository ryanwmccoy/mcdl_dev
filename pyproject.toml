[project]
name = "mcdl-dev"
version = "0.1.0"
description = "Dockerized Apache Kafka + PySpark streaming ML pipeline for network connection classification"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "kafka-python==2.0.2",
    "pandas>=2.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
